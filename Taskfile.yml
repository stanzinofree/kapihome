version: '3'

tasks:
  dev:
    desc: Start development environment
    cmds:
      - docker-compose up -d
      - echo "Development environment started"
      - echo "Backend -> http://localhost:8000"
      - echo "Frontend -> http://localhost:3000"

  build:
    desc: Build all containers
    cmds:
      - docker-compose build
      - echo "All containers built successfully"

  stop:
    desc: Stop all services
    cmds:
      - docker-compose down
      - echo "All services stopped"

  restart:
    desc: Restart all services
    cmds:
      - docker-compose restart
      - echo "All services restarted"

  logs:
    desc: Show logs from all services
    cmds:
      - docker-compose logs -f

  logs-backend:
    desc: Show backend logs
    cmds:
      - docker-compose logs -f backend

  logs-frontend:
    desc: Show frontend logs
    cmds:
      - docker-compose logs -f frontend

  clean:
    desc: Clean up containers, volumes and cache
    cmds:
      - docker-compose down -v
      - rm -rf data/*.json
      - echo "Cleanup completed"

  ps:
    desc: Show running containers
    cmds:
      - docker-compose ps

  shell-backend:
    desc: Open shell in backend container
    cmds:
      - docker-compose exec backend /bin/bash

  shell-frontend:
    desc: Open shell in frontend container
    cmds:
      - docker-compose exec frontend /bin/sh

  import-stats:
    desc: Import LinkedIn stats from JSON file (auto-finds in data_tmp/ or pass path)
    cmds:
      - python3 scripts/update_stats_from_json.py {{.CLI_ARGS}}

  import-posts:
    desc: Import LinkedIn posts from JSON file (auto-finds in data_tmp/ or pass path)
    cmds:
      - python3 scripts/update_posts_from_json.py {{.CLI_ARGS}}

  update-linkedin:
    desc: Complete LinkedIn data update workflow
    cmds:
      - echo "📋 LinkedIn Data Update Workflow"
      - echo "================================"
      - echo "1. Extract stats with Tampermonkey -> linkedin-stats-YYYY-MM-DD.json"
      - echo "2. Extract posts with Tampermonkey -> linkedin-posts-YYYY-MM-DD.json"
      - echo "3. Move JSON files to data_tmp/ directory"
      - echo "4. Run -> task import-stats"
      - echo "5. Run -> task import-posts"
      - echo "6. Run -> task restart"
      - echo ""
      - echo "💡 Tip> Files in data_tmp/ are auto-detected (no path needed!)"
      - echo "   Or pass explicit path> task import-stats -- ~/Downloads/file.json"
      - echo ""
      - echo "Tampermonkey scripts> scripts/tampermonkey/"

  import-exercism:
    desc: Import Exercism data from JSON file (auto-finds in data_tmp/ or pass path)
    cmds:
      - python3 scripts/update_exercism_from_json.py {{.CLI_ARGS}}

  update-exercism:
    desc: Complete Exercism data update workflow
    cmds:
      - echo "🎯 Exercism Data Update Workflow"
      - echo "================================"
      - echo "1. Visit your Exercism profile -> https://exercism.org/profiles/YOUR_USERNAME"
      - echo "2. Click 'Extract Exercism Data' button (Tampermonkey)"
      - echo "3. Move exercism-data-YYYY-MM-DD.json to data_tmp/"
      - echo "4. Run -> task import-exercism"
      - echo "5. Run -> task restart"
      - echo ""
      - echo "💡 Tip> Files in data_tmp/ are auto-detected (no path needed!)"
      - echo "   Or pass explicit path> task import-exercism -- ~/Downloads/file.json"
      - echo ""
      - echo "Tampermonkey script> scripts/tampermonkey/"
