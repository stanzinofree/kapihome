version: '3.8'

services:
  backend:
    build: ./backend
    container_name: kapihome-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
    networks:
      - kapihome-network

  frontend:
    build: ./frontend
    container_name: kapihome-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - kapihome-network
    depends_on:
      - backend

  scrapers:
    build: ./scrapers
    container_name: kapihome-scrapers
    volumes:
      - ./scrapers:/app
      - ./data:/app/data
      - ./data_tmp:/app/data_tmp
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
    networks:
      - kapihome-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  kapihome-network:
    driver: bridge

volumes:
  data:
